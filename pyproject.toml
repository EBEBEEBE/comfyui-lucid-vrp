version = "0.1.2"
description = "Visual image editing, Anima regional prompting, and MOSS-Image layout prompting for classic ComfyUI."
license = { file = "LICENSE" }
requires-python = ">=3.11"
# ComfyUI supplies torch, numpy, and Pillow; do not replace its runtime here.
dependencies = []

