"Bug Tracker" = "https://github.com/EBEBEEBE/comfyui-lucid-vrp/issues"

[tool.comfy]
PublisherId = "eb"
DisplayName = "LuCiD Visual Regional Painter"
Icon = "https://raw.githubusercontent.com/EBEBEEBE/comfyui-lucid-vrp/main/docs/images/icon.png"
