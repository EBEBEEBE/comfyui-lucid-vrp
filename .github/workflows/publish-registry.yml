name: Publish to Comfy Registry
run-name: Publish Comfy Registry from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/release-comfy-registry'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the selected release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check Registry identity and package inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          metadata = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          project, comfy = metadata['project'], metadata['tool']['comfy']
          assert project['name'] == 'lucid-vrp', 'Unexpected package ID'
          assert comfy['PublisherId'] == 'eb', 'Unexpected publisher ID'
          assert re.fullmatch(r'\d+\.\d+\.\d+', project['version']), 'Expected X.Y.Z version'
          assert not comfy.get('includes'), 'Review force-includes before publishing'
          ignores = {line.strip() for line in Path('.comfyignore').read_text().splitlines()}
          assert '/docs/' in ignores, 'Full documentation must be excluded from Registry'
          for name in ('anima-minimal', 'anima-external-regions', 'anima-image-to-image', 'moss-sft-layout'):
              assert Path('examples', name + '.json').is_file(), f'Missing sample: {name}'
          assert Path('examples/anima-image-to-image-input.webp').is_file(), 'Missing img2img input'
          print(f"Publishing {project['name']} {project['version']} as {comfy['PublisherId']}")
          PY

      - name: Install publishing CLI
        run: python -m pip install --disable-pip-version-check 'comfy-cli==1.23.0'

      - name: Publish the Registry package
        shell: bash
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo '::error::Add the REGISTRY_ACCESS_TOKEN repository secret before publishing.'
            exit 1
          fi
          comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"
